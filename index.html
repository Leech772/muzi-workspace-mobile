<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="木子工作台"/>
<meta name="theme-color" content="#f4f5f7"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/favicon-64-v1.png"/>
<link rel="apple-touch-icon" href="icons/icon-180.png"/>
<title>木子工作台 Mobile</title>
<style>
:root{--bg:#f4f5f7;--card:rgba(255,255,255,.78);--fg:#1d2230;--mut:#6b7385;--ac:#4f6bed;--ok:#1f9d63;--warn:#d97706;--bad:#d64545;--bd:rgba(20,30,60,.10);--r:16px;--sh:0 6px 24px rgba(30,40,80,.08);--blur:blur(18px);--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--bw:1px}
[data-theme=dark]{--bg:#0f1218;--card:rgba(32,37,48,.78);--fg:#e9ecf3;--mut:#9aa3b5;--ac:#7c93ff;--bd:rgba(255,255,255,.10);--sh:0 6px 24px rgba(0,0,0,.35)}
[data-appearance=liquid] body{background:radial-gradient(120% 60% at 0% 0%,rgba(124,147,255,.30),transparent 60%),radial-gradient(100% 60% at 100% 30%,rgba(255,170,200,.25),transparent 60%),var(--bg)}
[data-appearance=notebook]{--card:#fff;--r:6px;--sh:none;--blur:none;--ac:#2f6feb}
[data-appearance=notebook][data-theme=dark]{--card:#191919;--bg:#121212}
[data-appearance=notebook] body{font-family:ui-serif,Georgia,"Songti SC",serif}
[data-appearance=neo]{--bg:#fff7d6;--card:#fff;--fg:#111;--ac:#ff5c39;--bd:#111;--r:4px;--sh:4px 4px 0 #111;--blur:none;--bw:2px;--mut:#444}
[data-appearance=neo][data-theme=dark]{--bg:#1a1a1a;--card:#262626;--fg:#fafafa;--bd:#fafafa;--sh:4px 4px 0 #fafafa;--ac:#ffd23f;--mut:#bbb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);display:flex;align-items:center;gap:10px;border-bottom:var(--bw) solid var(--bd)}
header img{width:28px;height:28px;border-radius:8px}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .back{min-width:44px;min-height:44px;border:0;background:none;color:var(--ac);font-size:16px;padding:0}
main{padding:12px 14px calc(88px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border:var(--bw) solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin:0 0 12px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);min-height:52px}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{word-break:break-word}
.done .t{text-decoration:line-through;color:var(--mut)}
.chk{width:30px;height:30px;min-height:30px;flex:none;border-radius:50%;border:2px solid var(--ac);background:none;display:grid;place-items:center;color:#fff;font-size:16px;padding:0}
.done .chk{background:var(--ok);border-color:var(--ok)}
button,.btn{font:inherit;min-height:44px;border-radius:calc(var(--r) - 4px);border:var(--bw) solid var(--bd);background:var(--card);color:var(--fg);padding:0 14px;cursor:pointer}
.btn.pri,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
[data-appearance=neo] button.pri{color:#111;border-color:#111}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn.bad{color:var(--bad)}
.ib{min-width:40px;min-height:40px;padding:0;border:0;background:none;color:var(--mut);font-size:18px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);margin-right:4px}
.tag.high{color:#fff;background:var(--bad);border-color:var(--bad)}.tag.medium{color:var(--warn);border-color:var(--warn)}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:44px;padding:8px 12px;border-radius:calc(var(--r) - 6px);border:var(--bw) solid var(--bd);background:var(--bg);color:var(--fg)}
textarea{min-height:80px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;padding:10px 4px;border-radius:calc(var(--r) - 4px);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.bar{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.seg button{flex:none;border-radius:99px;min-height:38px}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px env(safe-area-inset-bottom);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:var(--bw) solid var(--bd)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;color:var(--mut);text-decoration:none;font-size:11px;gap:2px}
nav.tabs a .i{font-size:22px;line-height:1}nav.tabs a.on{color:var(--ac);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:var(--sh)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:var(--bw) solid var(--bd)}
.sheet h3{margin:0 0 4px}.sheet .acts{display:flex;gap:10px;margin-top:16px}.sheet .acts button{flex:1}
.menu a{display:flex;align-items:center;gap:12px;padding:14px 4px;color:var(--fg);text-decoration:none;border-top:1px solid var(--bd);min-height:56px}.menu a:first-child{border-top:0}.menu a span:last-child{margin-left:auto;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:99px;z-index:30;font-size:14px;max-width:90vw}
.empty{color:var(--mut);text-align:center;padding:14px 0;font-size:14px}
.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700}
</style></head>
<body>
<header><button class="back" id="back" hidden>‹ 返回</button><img src="icons/muzi-mark.svg" alt=""/><h1 id="title">木子工作台</h1><button class="ib" id="themeBtn" aria-label="切换深浅色">◐</button></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<script>
"use strict";
const LS='muzi-mobile-data-v1';
const COLS=['planItems','quickMemos','mediaContents','devProjects','devMilestones','devWorkItems','devLogs','clients','consultingProjects','consultingInteractions','consultingDeliverables','consultingFollowups','consultingTimeEntries','workoutTemplates','workoutTemplateExercises','workouts','workoutExercises','workoutSets','bodyMetrics','nutritionTargets','foods','meals','mealItems','entertainmentItems','playSessions'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16)});
const now=()=>new Date().toISOString();
const ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>ymd();
const loc=iso=>{const d=new Date(iso);return ymd(d).slice(5)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const addDay=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
function blank(){const d={settings:{theme:'light',appearance:'liquid'},trash:[]};COLS.forEach(c=>d[c]=[]);return d}
let D=load();
function load(){try{const r=localStorage.getItem(LS);if(r){const d=JSON.parse(r);const b=blank();COLS.forEach(c=>{if(!Array.isArray(d[c]))d[c]=[]});d.settings=Object.assign(b.settings,d.settings||{});d.trash=d.trash||[];return d}}catch(e){console.warn(e)}return blank()}
function save(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){toast('保存失败：存储空间不足？请导出备份')}}
const live=c=>D[c].filter(x=>!x.deleted_at);
const get=(c,id)=>D[c].find(x=>x.id===id);
function ins(c,o){const t=now();const r=Object.assign({id:uid()},o,{created_at:t,updated_at:t,deleted_at:null});D[c].push(r);save();return r}
function upd(c,id,o){const r=get(c,id);if(r){Object.assign(r,o,{updated_at:now()});save()}return r}
function del(c,id,title){const r=get(c,id);if(!r)return;r.deleted_at=now();D.trash.push({id:uid(),collection:c,entity_id:id,title:title||r.title||r.name||r.content||'',deleted_at:r.deleted_at});save();toast('已移入回收站')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function applyLook(){const h=document.documentElement;h.dataset.theme=D.settings.theme==='dark'?'dark':'light';h.dataset.appearance=['liquid','notebook','neo'].includes(D.settings.appearance)?D.settings.appearance:'liquid';document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.body).backgroundColor||'#f4f5f7'}
$('#themeBtn').onclick=()=>{D.settings.theme=D.settings.theme==='dark'?'light':'dark';save();applyLook()};

/* ---------- bottom sheet form ---------- */
function sheet(title,fields,onOk,extra){
 const m=document.createElement('div');m.className='mask';
 m.innerHTML=`<div class="sheet" role="dialog"><h3>${esc(title)}</h3>${fields.map(f=>{const v=f.value??'';
  if(f.type==='select')return `<label>${f.label}</label><select name="${f.name}">${f.options.map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${l}</option>`).join('')}</select>`;
  if(f.type==='textarea')return `<label>${f.label}</label><textarea name="${f.name}">${esc(v)}</textarea>`;
  return `<label>${f.label}</label><input name="${f.name}" type="${f.type||'text'}" ${f.type==='number'?'inputmode="decimal" step="any"':''} value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}/>`}).join('')}
  <div class="acts">${extra?'<button class="btn bad" data-x>删除</button>':''}<button data-c>取消</button><button class="pri" data-ok>保存</button></div></div>`;
 document.body.appendChild(m);
 const close=()=>m.remove();
 m.onclick=e=>{if(e.target===m)close()};
 m.querySelector('[data-c]').onclick=close;
 if(extra)m.querySelector('[data-x]').onclick=()=>{if(confirm('确定删除？可在回收站恢复')){extra();close();render()}};
 m.querySelector('[data-ok]').onclick=()=>{const o={};fields.forEach(f=>{let v=m.querySelector(`[name=${f.name}]`).value;if(f.type==='number')v=v===''?null:Number(v);o[f.name]=v});if(fields[0].req!==false&&(o[fields[0].name]===''||o[fields[0].name]==null)){toast('请填写'+fields[0].label);return}onOk(o);close();render()};
 const first=m.querySelector('input,textarea');if(first&&!fields[0].value)setTimeout(()=>first.focus(),50);
}

/* ---------- routes ---------- */
const TABS=[['home','⌂','首页'],['plan','☑','计划'],['fit','🏋','健身'],['diet','🍱','饮食'],['more','☰','更多']];
const PAGES={home:'首页总览',plan:'今日计划',fit:'健身计划',diet:'饮食计划',more:'更多',game:'游戏娱乐',media:'自媒体',dev:'开发工作',consult:'咨询工作',settings:'数据与设置',trash:'回收站',workout:'训练详情'};
let state={planDate:today(),dietDate:today()};
function route(){const h=(location.hash.slice(1)||'home').split('/');return{p:PAGES[h[0]]?h[0]:'home',arg:h[1]}}
function render(){
 const {p,arg}=route();
 const tabOf={game:'more',media:'more',dev:'more',consult:'more',settings:'more',trash:'more',workout:'fit'}[p]||p;
 $('#tabs').innerHTML=TABS.map(([k,i,l])=>`<a href="#${k}" class="${k===tabOf?'on':''}"><span class="i">${i}</span>${l}</a>`).join('');
 $('#title').textContent=PAGES[p];
 const back=tabOf!==p;$('#back').hidden=!back;$('#back').onclick=()=>history.back();
 document.querySelectorAll('.fab').forEach(x=>x.remove());
 $('#app').innerHTML=(V[p]||V.home)(arg);
 (B[p]||(()=>{}))(arg);
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
const fab=fn=>{const b=document.createElement('button');b.className='fab pri';b.textContent='+';b.setAttribute('aria-label','新增');b.onclick=fn;document.body.appendChild(b)};
const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,e=>fn(el,e)));
const PRI={high:'高',medium:'中',low:'低'};
const MEAL={breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'加餐'};
const ENT={wishlist:'想玩',active:'进行中',paused:'暂停',completed:'已完成'};
const prSort={high:0,medium:1,low:2};

function planRow(x){return `<div class="row ${x.status==='done'?'done':''}" data-id="${x.id}"><button class="chk" data-act="tog" aria-label="完成">${x.status==='done'?'✓':''}</button><div class="grow" data-act="edit"><div class="t">${esc(x.title)}</div><div class="mut"><span class="tag ${x.priority}">${PRI[x.priority]||'中'}</span>${x.start_time?esc(x.start_time)+' · ':''}${x.estimated_minutes?x.estimated_minutes+' 分钟':''}</div></div>${x.status!=='done'?'<button class="btn sm" data-act="defer">延期</button>':''}</div>`}
function planEdit(x){sheet(x?'编辑计划':'新增计划',[{name:'title',label:'标题',value:x?.title},{name:'plan_date',label:'日期',type:'date',value:x?.plan_date||state.planDate},{name:'start_time',label:'开始时间',type:'time',value:x?.start_time,req:false},{name:'estimated_minutes',label:'预计分钟',type:'number',value:x?.estimated_minutes},{name:'priority',label:'优先级',type:'select',value:x?.priority||'medium',options:Object.entries(PRI)},{name:'notes',label:'备注',type:'textarea',value:x?.notes}],o=>{o.start_time=o.start_time||null;x?upd('planItems',x.id,o):ins('planItems',Object.assign({status:'todo',source_module:null,source_entity_type:null,source_entity_id:null,complete_source:0,completed_at:null},o))},x?()=>del('planItems',x.id):null)}
function bindPlan(){on('[data-act]','click',(el)=>{const id=el.closest('[data-id]').dataset.id;const x=get('planItems',id);const a=el.dataset.act;
 if(a==='tog'){const d=x.status!=='done';upd('planItems',id,{status:d?'done':'todo',completed_at:d?now():null});render()}
 else if(a==='defer'){upd('planItems',id,{plan_date:addDay(x.plan_date,1)});toast('已延期到 '+x.plan_date);render()}
 else if(a==='edit')planEdit(x)})}
const plansOn=d=>live('planItems').filter(x=>x.plan_date===d).sort((a,b)=>(a.status==='done')-(b.status==='done')||prSort[a.priority]-prSort[b.priority]||(a.start_time||'99').localeCompare(b.start_time||'99'));
const kcalOf=mid=>live('mealItems').filter(i=>i.meal_id===mid).reduce((s,i)=>s+(+i.calories||0),0);
const kcalDay=d=>live('meals').filter(m=>m.meal_date===d&&m.entry_kind==='actual').reduce((s,m)=>s+kcalOf(m.id),0);
const target=()=>{const t=live('nutritionTargets').filter(t=>t.effective_date<=today()).sort((a,b)=>b.effective_date.localeCompare(a.effective_date))[0];return t?.calories||null};

const V={},B={};
V.home=()=>{const ps=plansOn(today());const dn=ps.filter(x=>x.status==='done').length;const pct=ps.length?Math.round(dn/ps.length*100):0;
 const w=live('workouts').filter(x=>x.workout_date===today());const k=kcalDay(today());const tg=target();
 const memos=live('quickMemos').filter(m=>!m.archived_at).sort((a,b)=>b.created_at.localeCompare(a.created_at));
 const g=live('entertainmentItems').filter(x=>x.status==='active');
 return `<div class="card"><h2>今日进度 <span class="mut">${today()}</span></h2><div class="bar"><i style="width:${pct}%"></i></div><p class="mut" style="margin:6px 0 10px">计划完成 ${dn}/${ps.length}（${pct}%）</p>
 <div class="grid3"><a class="stat" href="#plan" style="color:inherit;text-decoration:none"><b>${ps.length-dn}</b><span>待完成</span></a><a class="stat" href="#fit" style="color:inherit;text-decoration:none"><b>${w.length}</b><span>今日训练</span></a><a class="stat" href="#diet" style="color:inherit;text-decoration:none"><b>${k}</b><span>${tg?'/'+tg+' ':''}千卡</span></a></div></div>
 <div class="card"><h2>快速备忘</h2><div class="inline"><input id="memo" placeholder="想到什么，先记下…" enterkeyhint="done"/><button class="pri" id="memoAdd">记</button></div>
 ${memos.slice(0,20).map(m=>`<div class="row" data-id="${m.id}"><div class="grow t">${esc(m.content)}<div class="mut">${loc(m.created_at)}</div></div><button class="btn sm" data-m="plan">转计划</button><button class="ib" data-m="arc" aria-label="归档">✓</button></div>`).join('')||'<div class="empty">暂无备忘</div>'}</div>
 <div class="card"><h2>今日待办 <a href="#plan" class="mut">全部 ›</a></h2>${ps.filter(x=>x.status!=='done').slice(0,5).map(planRow).join('')||'<div class="empty">今天的计划都完成了 🎉</div>'}</div>
 ${g.length?`<div class="card"><h2>进行中的娱乐 <a href="#game" class="mut">›</a></h2>${g.slice(0,3).map(x=>`<div class="row"><div class="grow">${esc(x.name)}<div class="mut">${esc(x.progress||'')}</div></div></div>`).join('')}</div>`:''}`};
B.home=()=>{const add=()=>{const v=$('#memo').value.trim();if(!v)return;ins('quickMemos',{content:v,archived_at:null,converted_type:null,converted_id:null});render()};$('#memoAdd').onclick=add;$('#memo').onkeydown=e=>{if(e.key==='Enter')add()};
 on('[data-m]','click',el=>{const id=el.closest('[data-id]').dataset.id;const m=get('quickMemos',id);if(el.dataset.m==='arc'){upd('quickMemos',id,{archived_at:now()})}else{const p=ins('planItems',{title:m.content,plan_date:today(),start_time:null,estimated_minutes:null,priority:'medium',status:'todo',source_module:null,source_entity_type:null,source_entity_id:null,complete_source:0,notes:'',completed_at:null});upd('quickMemos',id,{archived_at:now(),converted_type:'plan_item',converted_id:p.id});toast('已加入今日计划')}render()});
 bindPlan()};

V.plan=()=>{const d=state.planDate;const ps=plansOn(d);const over=live('planItems').filter(x=>x.plan_date<today()&&x.status!=='done');
 return `<div class="card"><div class="inline"><button class="btn" id="pv">‹</button><input type="date" id="pd" value="${d}"/><button class="btn" id="pn">›</button></div>${d!==today()?'<button class="btn sm" id="pt" style="margin-top:8px">回到今天</button>':''}</div>
 ${over.length&&d===today()?`<div class="card"><h2>逾期未完成 <button class="btn sm" id="pull">全部移到今天</button></h2>${over.map(planRow).join('')}</div>`:''}
 <div class="card"><h2>${d===today()?'今天':d} · ${ps.filter(x=>x.status==='done').length}/${ps.length}</h2>${ps.map(planRow).join('')||'<div class="empty">点右下角 + 新增计划</div>'}</div>`};
B.plan=()=>{bindPlan();fab(()=>planEdit());$('#pd').onchange=e=>{state.planDate=e.target.value||today();render()};$('#pv').onclick=()=>{state.planDate=addDay(state.planDate,-1);render()};$('#pn').onclick=()=>{state.planDate=addDay(state.planDate,1);render()};if($('#pt'))$('#pt').onclick=()=>{state.planDate=today();render()};
 if($('#pull'))$('#pull').onclick=()=>{live('planItems').filter(x=>x.plan_date<today()&&x.status!=='done').forEach(x=>upd('planItems',x.id,{plan_date:today()}));render()}};

/* fitness */
const exOf=w=>live('workoutExercises').filter(e=>e.workout_id===w).sort((a,b)=>a.sort_order-b.sort_order);
const setsOf=e=>live('workoutSets').filter(s=>s.workout_exercise_id===e).sort((a,b)=>a.set_number-b.set_number);
V.fit=()=>{const ws=live('workouts').sort((a,b)=>b.workout_date.localeCompare(a.workout_date)||b.created_at.localeCompare(a.created_at));
 const bm=live('bodyMetrics').sort((a,b)=>b.metric_date.localeCompare(a.metric_date))[0];
 return `<div class="card"><h2>身体指标 <button class="btn sm" id="bm">记录</button></h2><div class="mut">${bm?`${bm.metric_date} · 体重 ${bm.weight??'-'} kg · 腰围 ${bm.waist??'-'} cm · 体脂 ${bm.body_fat??'-'}%`:'尚无记录'}</div></div>
 <div class="card"><h2>训练记录</h2>${ws.map(w=>{const ex=exOf(w.id);const n=ex.reduce((s,e)=>s+setsOf(e.id).length,0);return `<a class="row" href="#workout/${w.id}" style="color:inherit;text-decoration:none"><div class="grow"><div class="t">${esc(w.name)} ${w.body_part?`<span class="tag">${esc(w.body_part)}</span>`:''}</div><div class="mut">${w.workout_date} · ${ex.length} 个动作 · ${n} 组 · ${w.status==='completed'?'已完成':'计划中'}</div></div><span class="mut">›</span></a>`}).join('')||'<div class="empty">点 + 开始一次训练</div>'}</div>`};
B.fit=()=>{fab(()=>sheet('新训练',[{name:'name',label:'名称',value:'',ph:'如：推日 / 腿日'},{name:'body_part',label:'部位',value:'',req:false},{name:'workout_date',label:'日期',type:'date',value:today()}],o=>{const w=ins('workouts',Object.assign({template_id:null,status:'planned',feeling:'',started_at:null,completed_at:null},o));location.hash='workout/'+w.id}));
 $('#bm').onclick=()=>sheet('身体指标',[{name:'metric_date',label:'日期',type:'date',value:today()},{name:'weight',label:'体重 kg',type:'number'},{name:'waist',label:'腰围 cm',type:'number'},{name:'chest',label:'胸围 cm',type:'number'},{name:'body_fat',label:'体脂 %',type:'number'},{name:'notes',label:'备注',value:''}],o=>ins('bodyMetrics',o))};
V.workout=id=>{const w=get('workouts',id);if(!w||w.deleted_at)return '<div class="empty">训练不存在</div>';const ex=exOf(id);
 let vol=0;ex.forEach(e=>setsOf(e.id).forEach(s=>vol+=(+s.reps||0)*(+s.weight||0)));
 return `<div class="card"><h2>${esc(w.name)} <button class="btn sm" id="we">编辑</button></h2><div class="mut">${w.workout_date} · ${esc(w.body_part||'')} · 总容量 ${vol} kg</div>
 <div class="inline" style="margin-top:10px"><button class="${w.status==='completed'?'':'pri'}" id="wd" style="flex:1">${w.status==='completed'?'已完成 ✓（点此撤销）':'完成训练'}</button></div></div>
 ${ex.map(e=>`<div class="card" data-ex="${e.id}"><h2>${esc(e.name)} <button class="ib" data-a="delex" aria-label="删除动作">🗑</button></h2>
 ${setsOf(e.id).map(s=>`<div class="row ${s.completed?'done':''}" data-set="${s.id}"><button class="chk" data-a="sdone">${s.completed?'✓':''}</button><div class="grow t" data-a="sedit">第 ${s.set_number} 组 · ${s.reps??'-'} 次 × ${s.weight??'-'} kg</div><button class="ib" data-a="sdel" aria-label="删除">×</button></div>`).join('')}
 <button class="btn sm" data-a="addset" style="margin-top:8px;width:100%">+ 加一组</button></div>`).join('')}
 <div class="card"><div class="inline"><input id="exn" placeholder="动作名称，如 卧推" list="exl"/><button class="pri" id="exa">添加动作</button></div><datalist id="exl">${[...new Set(live('workoutExercises').map(e=>e.name))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>`};
B.workout=id=>{const w=get('workouts',id);if(!w)return;
 $('#we').onclick=()=>sheet('编辑训练',[{name:'name',label:'名称',value:w.name},{name:'body_part',label:'部位',value:w.body_part||''},{name:'workout_date',label:'日期',type:'date',value:w.workout_date},{name:'feeling',label:'感受',type:'textarea',value:w.feeling||''}],o=>upd('workouts',id,o),()=>{del('workouts',id);history.back()});
 $('#wd').onclick=()=>{const c=w.status!=='completed';upd('workouts',id,{status:c?'completed':'planned',completed_at:c?now():null});render()};
 const addEx=()=>{const n=$('#exn').value.trim();if(!n)return;ins('workoutExercises',{workout_id:id,name:n,sort_order:exOf(id).length});render()};$('#exa').onclick=addEx;$('#exn').onkeydown=e=>{if(e.key==='Enter')addEx()};
 on('[data-a]','click',el=>{const eid=el.closest('[data-ex]').dataset.ex;const a=el.dataset.a;const sid=el.closest('[data-set]')?.dataset.set;
  if(a==='delex'){if(confirm('删除该动作？')){del('workoutExercises',eid);render()}}
  else if(a==='addset'){const ss=setsOf(eid);const last=ss[ss.length-1];sheet('第 '+(ss.length+1)+' 组',[{name:'reps',label:'次数',type:'number',value:last?.reps??''},{name:'weight',label:'重量 kg',type:'number',value:last?.weight??''}],o=>ins('workoutSets',Object.assign({workout_exercise_id:eid,set_number:ss.length+1,completed:0},o)))}
  else if(a==='sdone'){const s=get('workoutSets',sid);upd('workoutSets',sid,{completed:s.completed?0:1});render()}
  else if(a==='sdel'){del('workoutSets',sid,'训练组');render()}
  else if(a==='sedit'){const s=get('workoutSets',sid);sheet('第 '+s.set_number+' 组',[{name:'reps',label:'次数',type:'number',value:s.reps},{name:'weight',label:'重量 kg',type:'number',value:s.weight}],o=>upd('workoutSets',sid,o))}})};

/* diet */
V.diet=()=>{const d=state.dietDate;const ms=live('meals').filter(m=>m.meal_date===d);const k=kcalDay(d);const tg=target();
 return `<div class="card"><div class="inline"><button class="btn" id="dv">‹</button><input type="date" id="dd" value="${d}"/><button class="btn" id="dn">›</button></div>
 <div style="margin-top:12px"><div class="bar"><i style="width:${tg?Math.min(100,k/tg*100):0}%"></i></div><p class="mut" style="margin:6px 0 0">已吃 ${k} 千卡 ${tg?`/ 目标 ${tg}`:''} <button class="btn sm" id="tgt" style="float:right">设目标</button></p></div></div>
 ${Object.entries(MEAL).map(([t,l])=>{const list=ms.filter(m=>m.meal_type===t);return `<div class="card"><h2>${l} <span class="mut">${list.reduce((s,m)=>s+kcalOf(m.id),0)} 千卡</span></h2>
 ${list.map(m=>live('mealItems').filter(i=>i.meal_id===m.id).map(i=>`<div class="row" data-it="${i.id}"><div class="grow t">${esc(i.food_name)} <span class="mut">${esc(i.quantity??'')}</span></div><span>${i.calories??0}</span><button class="ib" data-d="del" aria-label="删除">×</button></div>`).join('')).join('')||'<div class="empty">未记录</div>'}
 <button class="btn sm" data-add="${t}" style="width:100%;margin-top:6px">+ 添加食物</button></div>`}).join('')}`};
B.diet=()=>{const d=state.dietDate;$('#dd').onchange=e=>{state.dietDate=e.target.value||today();render()};$('#dv').onclick=()=>{state.dietDate=addDay(d,-1);render()};$('#dn').onclick=()=>{state.dietDate=addDay(d,1);render()};
 $('#tgt').onclick=()=>sheet('营养目标',[{name:'calories',label:'每日热量 千卡',type:'number',value:target()},{name:'protein',label:'蛋白质 g',type:'number'},{name:'carbs',label:'碳水 g',type:'number'},{name:'fat',label:'脂肪 g',type:'number'}],o=>ins('nutritionTargets',Object.assign({effective_date:today()},o)));
 on('[data-add]','click',el=>{const t=el.dataset.add;sheet('添加到'+MEAL[t],[{name:'food_name',label:'食物',value:'',ph:'如：鸡胸肉'},{name:'quantity',label:'份量',value:'',ph:'如 150g / 1碗',req:false},{name:'calories',label:'热量 千卡',type:'number'},{name:'protein',label:'蛋白质 g',type:'number'}],o=>{let m=live('meals').find(m=>m.meal_date===d&&m.meal_type===t&&m.entry_kind==='actual');if(!m)m=ins('meals',{meal_date:d,meal_type:t,name:MEAL[t],entry_kind:'actual',notes:''});ins('mealItems',Object.assign({meal_id:m.id,food_id:null,carbs:null,fat:null},o))})});
 on('[data-d]','click',el=>{del('mealItems',el.closest('[data-it]').dataset.it);render()})};

/* games */
let tick=null;
const runKey='muzi-mobile-timer';
V.game=()=>{const items=live('entertainmentItems');const run=JSON.parse(localStorage.getItem(runKey)||'null');
 const mins=id=>live('playSessions').filter(s=>s.entertainment_id===id).reduce((s,x)=>s+(+x.duration_minutes||0),0);
 const order=['active','wishlist','paused','completed'];
 return `${run?`<div class="card"><h2>计时中：${esc(get('entertainmentItems',run.id)?.name)}</h2><div class="timer" id="tm">00:00</div><button class="pri" id="stop" style="width:100%;margin-top:8px">停止并记录</button></div>`:''}
 ${order.map(st=>{const l=items.filter(x=>x.status===st);return l.length?`<div class="card"><h2>${ENT[st]} <span class="mut">${l.length}</span></h2>${l.map(x=>`<div class="row" data-id="${x.id}"><div class="grow" data-g="edit"><div class="t">${esc(x.name)} ${x.platform?`<span class="tag">${esc(x.platform)}</span>`:''}</div><div class="mut">${esc(x.progress||'')}${x.next_goal?' · 下一步：'+esc(x.next_goal):''} · 累计 ${mins(x.id)} 分钟</div></div>${run?'':`<button class="btn sm" data-g="start">▶ 计时</button>`}</div>`).join('')}</div>`:''}).join('')||'<div class="card empty">点 + 添加游戏/剧集</div>'}`};
B.game=()=>{clearInterval(tick);const run=JSON.parse(localStorage.getItem(runKey)||'null');
 const edit=x=>sheet(x?'编辑':'新增娱乐',[{name:'name',label:'名称',value:x?.name},{name:'platform',label:'平台',value:x?.platform||'',req:false},{name:'activity_type',label:'类型',type:'select',value:x?.activity_type||'game',options:[['game','游戏'],['show','剧集'],['book','书'],['other','其他']]},{name:'status',label:'状态',type:'select',value:x?.status||'wishlist',options:Object.entries(ENT)},{name:'progress',label:'当前进度',value:x?.progress||''},{name:'next_goal',label:'下一个目标',value:x?.next_goal||''},{name:'rating',label:'评分 1-10',type:'number',value:x?.rating}],o=>{if(o.status==='completed'&&x?.status!=='completed')o.completed_date=today();x?upd('entertainmentItems',x.id,o):ins('entertainmentItems',Object.assign({notes:'',completed_date:null},o))},x?()=>del('entertainmentItems',x.id):null);
 fab(()=>edit());
 on('[data-g]','click',el=>{const id=el.closest('[data-id]').dataset.id;if(el.dataset.g==='edit')edit(get('entertainmentItems',id));else{localStorage.setItem(runKey,JSON.stringify({id,start:now()}));const x=get('entertainmentItems',id);if(x.status!=='active')upd('entertainmentItems',id,{status:'active'});render()}});
 if(run){const f=()=>{const s=Math.floor((Date.now()-Date.parse(run.start))/1000);const el=$('#tm');if(el)el.textContent=String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};f();tick=setInterval(f,1000);
  $('#stop').onclick=()=>{const m=Math.max(1,Math.round((Date.now()-Date.parse(run.start))/60000));sheet('记录本次游玩（'+m+' 分钟）',[{name:'progress_note',label:'进度备注',value:'',req:false},{name:'duration_minutes',label:'分钟',type:'number',value:m}],o=>{ins('playSessions',Object.assign({entertainment_id:run.id,started_at:run.start,ended_at:now()},o));if(o.progress_note)upd('entertainmentItems',run.id,{progress:o.progress_note});localStorage.removeItem(runKey);clearInterval(tick)})}}};

/* more + simple lists */
V.more=()=>`<div class="card menu"><a href="#game"><span>🎮</span><span>游戏娱乐</span><span>›</span></a><a href="#media"><span>📣</span><span>自媒体</span><span>›</span></a><a href="#dev"><span>💻</span><span>开发工作</span><span>›</span></a><a href="#consult"><span>🤝</span><span>咨询工作</span><span>›</span></a></div><div class="card menu"><a href="#settings"><span>⚙️</span><span>数据与设置</span><span>›</span></a><a href="#trash"><span>🗑</span><span>回收站</span><span>${D.trash.filter(t=>get(t.collection,t.entity_id)?.deleted_at).length}</span></a></div><p class="mut" style="text-align:center">数据仅保存在本机浏览器 · 无账号 · 无云</p>`;
const SIMPLE={
 media:{c:'mediaContents',t:'title',sub:x=>`${{idea:'灵感',draft:'草稿',production:'制作',scheduled:'待发布',published:'已发布'}[x.stage]||x.stage} · ${x.platform||''}`,f:x=>[{name:'title',label:'标题',value:x?.title},{name:'platform',label:'平台',value:x?.platform||''},{name:'stage',label:'阶段',type:'select',value:x?.stage||'idea',options:[['idea','灵感'],['draft','草稿'],['production','制作'],['scheduled','待发布'],['published','已发布']]},{name:'copy_text',label:'文案',type:'textarea',value:x?.copy_text||''}],def:{content_format:'',planned_publish_at:null,published_at:null,asset_path:'',publish_url:'',views:0,likes:0,comments:0,archived_at:null}},
 dev:{c:'devProjects',t:'name',sub:x=>{const n=live('devWorkItems').filter(i=>i.project_id===x.id&&i.status!=='done').length;return `${x.status||''} · ${n} 个未完成工作项（详情请在桌面版）`},f:x=>[{name:'name',label:'项目名',value:x?.name},{name:'status',label:'状态',type:'select',value:x?.status||'active',options:[['active','进行中'],['paused','暂停'],['done','完成']]},{name:'description',label:'描述',type:'textarea',value:x?.description||''}],def:{local_path:'',repository_url:'',document_url:'',archived_at:null}},
 consult:{c:'consultingProjects',t:'name',sub:x=>`${get('clients',x.client_id)?.name||'未知客户'} · ${x.current_need||''}`,f:x=>[{name:'name',label:'项目名',value:x?.name},{name:'client',label:'客户名',value:x?get('clients',x.client_id)?.name||'':''},{name:'current_need',label:'当前需求',type:'textarea',value:x?.current_need||''}],def:{status:'active',archived_at:null}}};
function simpleV(k){const s=SIMPLE[k];const l=live(s.c).filter(x=>!x.archived_at);return `<div class="card">${l.map(x=>`<div class="row" data-id="${x.id}"><div class="grow"><div class="t">${esc(x[s.t])}</div><div class="mut">${esc(s.sub(x))}</div></div></div>`).join('')||'<div class="empty">暂无，点 + 新增（简化版）</div>'}</div><p class="mut">移动端为简化列表；完整流程请使用桌面版。</p>`}
function simpleB(k){const s=SIMPLE[k];const save1=(x,o)=>{if(k==='consult'){const cn=(o.client||'未命名客户').trim();delete o.client;let c=live('clients').find(c=>c.name===cn);if(!c)c=ins('clients',{name:cn,notes:'',archived_at:null});o.client_id=c.id}x?upd(s.c,x.id,o):ins(s.c,Object.assign({},s.def,o))};
 const ed=x=>sheet(x?'编辑':'新增',s.f(x),o=>save1(x,o),x?()=>del(s.c,x.id):null);fab(()=>ed());on('[data-id]','click',el=>ed(get(s.c,el.dataset.id)))}
['media','dev','consult'].forEach(k=>{V[k]=()=>simpleV(k);B[k]=()=>simpleB(k)});

V.trash=()=>{const l=D.trash.filter(t=>get(t.collection,t.entity_id)?.deleted_at).sort((a,b)=>b.deleted_at.localeCompare(a.deleted_at));return `<div class="card">${l.map(t=>`<div class="row" data-t="${t.id}"><div class="grow"><div class="t">${esc(t.title)}</div><div class="mut">${t.collection} · ${loc(t.deleted_at)}</div></div><button class="btn sm" data-r>恢复</button></div>`).join('')||'<div class="empty">回收站为空</div>'}</div>${l.length?'<button class="btn bad" id="purge" style="width:100%">永久清空回收站</button>':''}`};
B.trash=()=>{on('[data-r]','click',el=>{const t=D.trash.find(t=>t.id===el.closest('[data-t]').dataset.t);upd(t.collection,t.entity_id,{deleted_at:null});D.trash=D.trash.filter(x=>x!==t);save();render()});
 if($('#purge'))$('#purge').onclick=()=>{if(!confirm('永久删除回收站全部内容？不可恢复'))return;COLS.forEach(c=>D[c]=D[c].filter(x=>!x.deleted_at));D.trash=[];save();render()}};

/* settings */
V.settings=()=>{const n=COLS.reduce((s,c)=>s+live(c).length,0);const sz=(localStorage.getItem(LS)||'').length;
 return `<div class="card"><h2>外观</h2><label>风格</label><div class="seg" id="ap">${[['liquid','流光玻璃'],['notebook','Notion 笔记'],['neo','Neo-Brutalism']].map(([k,l])=>`<button data-ap="${k}" class="${D.settings.appearance===k?'on':''}">${l}</button>`).join('')}</div>
 <label>深浅色</label><div class="seg">${[['light','浅色'],['dark','深色']].map(([k,l])=>`<button data-th="${k}" class="${D.settings.theme===k?'on':''}">${l}</button>`).join('')}</div></div>
 <div class="card"><h2>数据</h2><p class="mut">共 ${n} 条记录 · 约 ${(sz/1024).toFixed(1)} KB · 仅保存在本机</p>
 <div class="grid2"><button class="pri" id="exp">导出 JSON</button><button id="imp">导入 JSON</button></div>
 <p class="mut">导出格式与桌面版导出 zip 内 <b>all-data.json</b> 一致，可互相导入（桌面版 zip 需先解压取出 all-data.json）。导入会<b>覆盖</b>本机数据，导入前自动下载一份当前备份。</p>
 <input type="file" id="file" accept="application/json,.json" hidden/>
 <button class="btn bad" id="clr" style="width:100%;margin-top:6px">清空全部数据</button></div>
 <div class="card"><h2>关于</h2><p class="mut">木子工作台 Mobile 原型 v0.1 · 离线 PWA · ${navigator.storage&&navigator.storage.persist?'<span id="pst">检查持久化…</span>':''}</p></div>`};
function download(name,text){const b=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportObj(){const o={};COLS.forEach(c=>o[c]=D[c].slice());/* 含软删除记录，便于桌面版合并删除 */o.settings=D.settings;o.trash=D.trash.filter(t=>get(t.collection,t.entity_id)?.deleted_at);o._meta={exportedAt:now(),app:'MuziWorkspace',source:'mobile',formatVersion:1};return o}
B.settings=()=>{on('[data-ap]','click',el=>{D.settings.appearance=el.dataset.ap;save();applyLook();render()});on('[data-th]','click',el=>{D.settings.theme=el.dataset.th;save();applyLook();render()});
 const ts=()=>now().replace(/[:.]/g,'-');
 $('#exp').onclick=()=>{download('muzi-mobile-'+ts()+'.json',JSON.stringify(exportObj(),null,2));toast('已导出')};
 $('#imp').onclick=()=>$('#file').click();
 $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const src=j['all-data.json']||j;if(!COLS.some(c=>Array.isArray(src[c])))throw new Error('不是木子工作台的数据');
   const cnt=COLS.reduce((s,c)=>s+(src[c]||[]).length,0);if(!confirm(`将导入 ${cnt} 条记录并覆盖本机数据，继续？`))return;
   download('muzi-mobile-before-import-'+ts()+'.json',JSON.stringify(exportObj()));
   const d=blank();COLS.forEach(c=>d[c]=(src[c]||[]).map(x=>Object.assign({deleted_at:null},x)));d.settings=Object.assign(d.settings,src.settings||{});d.trash=[];D=d;save();applyLook();toast('导入完成');render()}catch(err){alert('导入失败：'+err.message)}};r.readAsText(f);e.target.value=''};
 $('#clr').onclick=()=>{if(!confirm('清空全部数据？建议先导出备份'))return;if(prompt('输入“清空”确认')!=='清空')return;const s=D.settings;D=blank();D.settings=s;save();render();toast('已清空')};
 if($('#pst'))navigator.storage.persisted().then(p=>{$('#pst').textContent=p?'存储已持久化':'存储未持久化（建议添加到主屏幕并定期导出）'})};

applyLook();render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
